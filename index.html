<script>
const questionsBank = {
  stage1: [
    {
      question: "کدام یک از موارد زیر یک «چندضلعی» است؟",
      options: [
        { text: "مثلث", correct: true },
        { text: "دایره", correct: false },
        { text: "خط باز", correct: false },
        { text: "ضربدر", correct: false }
      ],
      explanation: "چندضلعی یک خط شکسته بسته است که اضلاع آن همدیگر را قطع نکنند. مثلث این ویژگی را دارد اما دایره ضلع ندارد، خط باز بسته نیست و ضربدر اضلاعش همدیگر را قطع می‌کنند."
    },
    {
      question: "چندضلعی منتظم چه ویژگی دارد؟",
      options: [
        { text: "فقط اضلاعش برابر باشند", correct: false },
        { text: "فقط زاویه‌هایش برابر باشند", correct: false },
        { text: "هم اضلاع و هم زاویه‌هایش برابر باشند", correct: true },
        { text: "مرکز تقارن داشته باشد", correct: false }
      ],
      explanation: "چندضلعی منتظم باید دو شرط را همزمان داشته باشد: ۱) تمام اضلاعش با هم برابر باشند ۲) تمام زاویه‌های داخلی‌اش با هم برابر باشند."
    },
    {
      question: "نام چندضلعی‌ای که ۶ ضلع دارد چیست؟",
      options: [
        { text: "پنج‌ضلعی", correct: false },
        { text: "شش‌ضلعی", correct: true },
        { text: "هفت‌ضلعی", correct: false },
        { text: "هشت‌ضلعی", correct: false }
      ],
      explanation: "نام‌گذاری چندضلعی‌ها بر اساس تعداد اضلاع آن‌ها انجام می‌شود."
    },
    {
      question: "کدام شکل یک «چندضلعی محدب» است؟",
      options: [
        { text: "پنج‌ضلعی محدب", correct: true },
        { text: "ستاره پنج‌پر", correct: false },
        { text: "شکل L", correct: false },
        { text: "پیکان", correct: false }
      ],
      explanation: "در چندضلعی محدب، تمام زاویه‌های داخلی کمتر از ۱۸۰ درجه هستند. ستاره، L و پیکان همگی مقعرند."
    },
    {
      question: "به نقطه‌ای که دو ضلع یک چندضلعی به هم می‌رسند چه می‌گویند؟",
      options: [
        { text: "ضلع", correct: false },
        { text: "رأس", correct: true },
        { text: "زاویه", correct: false },
        { text: "قطر", correct: false }
      ],
      explanation: "رأس نقطه‌ای است که دو ضلع متوالی یک چندضلعی به هم می‌رسند."
    },
    {
      question: "کدام یک از شکل‌های زیر چندضلعی منتظم است؟",
      options: [
        { text: "مربع", correct: true },
        { text: "مستطیل", correct: false },
        { text: "لوزی", correct: false },
        { text: "ذوزنقه", correct: false }
      ],
      explanation: "مربع هم تمام اضلاعش برابرند و هم تمام زاویه‌هایش ۹۰ درجه است."

function toPersianNum(num) {
  return num.toString().replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
}

function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function selectRandomQuestions(stageNum) {
  let pool = [...questionsBank['stage' + stageNum]];
  if (stageNum === 3) {
    const easy = shuffleArray(pool.filter(q => q.difficulty === 'easy')).slice(0, 2);
    const medium = shuffleArray(pool.filter(q => q.difficulty === 'medium')).slice(0, 2);
    const hard = shuffleArray(pool.filter(q => q.difficulty === 'hard')).slice(0, 2);
    return shuffleArray([...easy, ...medium, ...hard]);
  }
  return shuffleArray(pool).slice(0, QUESTIONS_PER_STAGE);
}

function checkAnswer(optIdx) {
  if (answered) return;
  answered = true;
  
  const q = stageQuestions[currentQuestionIndex];
  const isCorrect = q.options[optIdx].correct;
  
  stageStats[currentStage].total++;
  if (isCorrect) {
    stageStats[currentStage].correct++;
    let points = 10;
    if (q.difficulty === 'medium') points = 15;
    if (q.difficulty === 'hard') points = 20;
    totalScore += points;
  }
  
  const buttons = document.querySelectorAll('.option-btn');
  buttons.forEach((btn, i) => {
    btn.classList.add('disabled');
    if (q.options[i].correct) btn.classList.add('correct');
    else if (i === optIdx && !isCorrect) btn.classList.add('wrong');
  });
  
  const fb = document.getElementById('feedback');
  if (isCorrect) {
    let points = 10;
    if (q.difficulty === 'medium') points = 15;
    if (q.difficulty === 'hard') points = 20;
    fb.className = 'feedback show success';
    fb.innerHTML = `<div class="fb-title">🎉 آفرین! پاسخ درست بود (+${toPersianNum(points)} امتیاز)</div>${q.explanation}`;
  } else {
    fb.className = 'feedback show error';
    fb.innerHTML = `<div class="fb-title">💪 اشکالی نداره! بیا یاد بگیریم</div>${q.explanation}`;
  }
  
  document.getElementById('nextBtn').className = 'next-btn show';
  document.querySelector('.info-item:nth-child(3) .value').textContent = toPersianNum(totalScore) + ' ⭐';
}

function nextQuestion() {
  currentQuestionIndex++;
  if (currentQuestionIndex >= stageQuestions.length) {
    if (currentStage < 3) {
      currentStage++;
      renderTeaching();
    } else {
      renderReport();
    }
  } else {
    renderQuestion();
  }
}

          <span class="value">${status}</span>
        </div>
      </div>
    `;
  }
  
  container.innerHTML = `
    <h1>📊 کارنامه شما</h1>
    <div class="report-screen">
      <div class="report-emoji">${emoji}</div>
      <h2>${message}</h2>
      <div class="student-name">👧 ${playerData.firstName} ${playerData.lastName}</div>
      <div style="color:#8e44ad; font-size:16px; font-weight:700;">🏫 کلاس: ${playerData.className}</div>
      
      <div class="report-score">${toPersianNum(totalScore)} امتیاز ⭐</div>
      
      <div class="report-details">
        <div class="report-row">
          <span class="label">📝 تعداد کل سوالات:</span>
          <span class="value">${toPersianNum(totalQuestions)}</span>
        </div>
        <div class="report-row">
          <span class="label">✅ پاسخ‌های درست:</span>
          <span class="value" style="color:#28a745;">${toPersianNum(totalCorrect)}</span>
        </div>
        <div class="report-row">
          <span class="label">❌ پاسخ‌های نادرست:</span>
          <span class="value" style="color:#dc3545;">${toPersianNum(totalQuestions - totalCorrect)}</span>
        </div>
        <div class="report-row">
          <span class="label">🎯 درصد موفقیت:</span>
          <span class="value">${toPersianNum(percentage)}٪</span>
        </div>
      </div>
      
      <div class="feedback-message">
        <div style="font-weight:900; margin-bottom:10px; font-size:18px;">💬 بازخورد معلم:</div>
        ${feedbackText}
      </div>
      
      <h3 style="color:#8e44ad; margin:25px 0 15px; text-align:right; font-size:20px; font-weight:900;">📈 تحلیل عملکرد در هر مرحله:</h3>
      ${stageAnalysis}
      
      <button class="restart-btn" onclick="restartGame()">🔄 بازی مجدد</button>
    </div>
    
    <div class="footer">
      💖 طراحی و تولید: <span class="designer">نرگس اکبری</span> | معلم ریاضی پایه هشتم 🌷
    </div>
  `;
}

function restartGame() {
  renderWelcome();
}

renderWelcome();
</script>
</body>
</html>
